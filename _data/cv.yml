- title: Technical Skills
  type: nested_list
  contents:
    - title: Computing time awarded
      items:
        - 10k CPU-hours in Pegasus (IUCAA) (PI, 2024)
        - '10k CPU-hours in <a href="https://www.cscs.ch/computers/alps">CSCS Alps</a> (Co-PI, 2024–25)'
    - title: Simulations developed
      items:
        - 'Cross-bispectrum estimator for all unique triangles (used in <a href="https://arxiv.org/abs/2604.15440">arXiv:2604.15440</a>)'
        - GPU-accelerated multi-line intensity mapping simulations (21 cm, CII, CO)
        - SBI pipeline for multi-line intensity mapping and their cross-correlations
    - title: Cosmological simulations used
      items:
        - '<a href="https://github.com/leonnoble/ReionYuga">ReionYuga</a>, <a href="https://github.com/21cmfast/21cmFAST">21cmFAST</a>; <a href="https://github.com/leonnoble/N-body">Particle-Mesh N-body</a>, <a href="https://github.com/rainwoodman/fastpm">FastPM</a>; <a href="https://github.com/chandra-001/LIM_simulator">LIM simulator</a>'
    - title: Inference & cosmology packages used
      items:
        - polychord, PyMultiNest, Cobaya, emcee, CosmoMC, CAMB
    - title: HPC facilities used
      items:
        - '<a href="https://www.cscs.ch/computers/alps">CSCS Alps</a>, Pegasus (IUCAA), Jamadagni (IIT Indore), NVIDIA DGX A100 Server (IIT Indore)'
    - title: Languages & tools
      items:
        - Python, C++, C; Git; Docker, Singularity

